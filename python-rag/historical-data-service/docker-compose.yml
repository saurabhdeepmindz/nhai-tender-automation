# docker-compose.yml
# Complete deployment stack for NHAI Tender Query System

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nhai_postgres
    environment:
      POSTGRES_DB: nhai_tender_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nhai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for Bull Queue)
  redis:
    image: redis:7-alpine
    container_name: nhai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nhai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python RAG Service (FastAPI)
  rag_service:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    container_name: nhai_rag_service
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - USE_LOCAL_EMBEDDINGS=${USE_LOCAL_EMBEDDINGS:-false}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.3}
      - CHROMA_DB_DIR=/app/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - ./rag_service:/app
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
    networks:
      - nhai_network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nhai_backend
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=nhai_tender_db
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RAG_SERVICE_URL=http://rag_service:8000
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - nhai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag_service:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nhai_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    ports:
      - "3001:3000"
    networks:
      - nhai_network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  nhai_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  uploads_data:
    driver: local
